name: Windows diagnostics

# Temporary: gathers evidence for the Windows crash (spec section 13.1).
# Runs on pushes to debug/windows-* branches only.

on:
  push:
    branches: ["debug/windows-*"]

jobs:
  diagnose:
    name: Diagnose (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, x86_64-pc-windows-gnu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: jcs090218/setup-emacs-windows@master
        with:
          version: "30.1"

      - name: Build and install the test module
        shell: bash
        run: |
          cargo build -p emrs-test-module --target ${{ matrix.target }}
          mkdir -p target/elisp
          cp target/${{ matrix.target }}/debug/emrs_test_module.dll target/elisp/emrs-test-module.dll

      - name: C runtime imports
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $emacs = (Get-Command emacs).Source
          "emacs: $emacs"
          & $dumpbin.FullName /dependents $emacs
          & $dumpbin.FullName /dependents target\elisp\emrs-test-module.dll
          & $dumpbin.FullName /imports target\elisp\emrs-test-module.dll | Select-String -Pattern '\.dll$|\b_?(write|_write|_get_osfhandle|close|_close)\b'

      - name: Single tests with real exit codes
        shell: pwsh
        run: |
          $root = (Get-Location).Path -replace '\\', '/'
          function Run-One($test, $assertions) {
            $flags = @('--batch')
            if ($assertions) { $flags += '--module-assertions' }
            $flags += @('-L', "$root/elisp", '-L', "$root/target/elisp",
                        '-l', "$root/tests/elisp/emrs-tests.el",
                        '--eval', "(ert-run-tests-batch-and-exit `"^$test`$`")")
            "===== $test (module assertions: $assertions)"
            & emacs @flags 2>&1 | ForEach-Object { "$_" }
            "exit code: $LASTEXITCODE (0x{0:X8})" -f $LASTEXITCODE
          }
          Run-One 'emrs-test-bad-start-args' $true
          Run-One 'emrs-test-call-runs-callback-once' $true
          Run-One 'emrs-test-scalars-round-trip' $true
          Run-One 'emrs-test-bytes-round-trip' $true
          Run-One 'emrs-test-bytes-round-trip' $false
          "===== full suite"
          & emacs --batch --module-assertions -L "$root/elisp" -L "$root/target/elisp" `
            -l "$root/tests/elisp/emrs-tests.el" -f ert-run-tests-batch-and-exit 2>&1 | ForEach-Object { "$_" }
          "exit code: $LASTEXITCODE (0x{0:X8})" -f $LASTEXITCODE
          exit 0

      - name: Application error events
        if: always()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddHours(-1)} -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in 'Application Error', 'Windows Error Reporting' } |
            Format-List TimeCreated, ProviderName, Message
