name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check -p emrs -p cargo-emacs

  emacs:
    name: Emacs ${{ matrix.emacs }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        emacs: ["30.1", "31.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - run: tests/run-ert.sh
      - run: examples/run-examples.sh

  macos-x86_64-build:
    name: Build for macOS x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - run: cargo build --workspace --target x86_64-apple-darwin

  windows:
    name: Windows (best effort)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: jcs090218/setup-emacs-windows@master
        with:
          version: "30.1"
      - run: tests/run-ert.sh
        shell: bash
